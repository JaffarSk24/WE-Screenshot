name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon, the platform the app is made for.
          - os: macos-26
            experimental: false
          - os: macos-15
            experimental: false
          # Intel, for the x86_64 half of the universal binary.
          - os: macos-15-intel
            experimental: false
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  app:
    name: Universal app bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Build the app (ad hoc signature)
        run: tools/build_app.sh --no-install
      - name: Check the bundle
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          ZIP="build/WE-Screenshot-$VERSION.zip"
          test -f "$ZIP"
          WORK=$(mktemp -d)
          ditto -x -k "$ZIP" "$WORK"
          APP="$WORK/WE Screenshot.app"
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/WEScreenshot")
          echo "architectures: $ARCHS"
          [[ " $ARCHS " == *" arm64 "* ]]
          [[ " $ARCHS " == *" x86_64 "* ]]
          codesign --verify --strict --verbose=2 "$APP"
          test "$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Contents/Info.plist")" = "sk.whiteeagles.screenshot"
          test "$(/usr/libexec/PlistBuddy -c "Print LSMinimumSystemVersion" "$APP/Contents/Info.plist")" = "13.0"
          for lang in en ru sk; do test -f "$APP/Contents/Resources/$lang.lproj/Localizable.strings"; done
          # The arm64 half must start on this runner and print its version.
          "$APP/Contents/MacOS/WEScreenshot" --version
      # A real capture of the runner's screen through ScreenCaptureKit. It
      # depends on the Screen Recording permission of the runner image, so a
      # failure here does not fail the build.
      - name: Capture smoke test
        continue-on-error: true
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          ditto -x -k build/WE-Screenshot-*.zip "$WORK"
          mkdir -p capture
          "$WORK/WE Screenshot.app/Contents/MacOS/WEScreenshot" --capture-test "$PWD/capture/shot"
          for f in capture/*.png; do sips -g pixelWidth -g pixelHeight -g dpiWidth "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-${{ matrix.os }}
          path: capture/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WE-Screenshot-unsigned-${{ matrix.os }}
          path: build/WE-Screenshot-*.zip
          if-no-files-found: error
